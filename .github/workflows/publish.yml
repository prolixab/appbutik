name: Publish store

on:
  push:
    branches: [main]
  workflow_dispatch:
  # App repos can trigger a rebuild right after a release:
  #   gh api repos/OWNER/appbutik/dispatches -f event_type=app-released
  repository_dispatch:
    types: [app-released]
  # Daily sweep picks up new releases from sources.txt anyway.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's packaged fdroidserver (2.2.1) bundles an androguard that crashes on
      # resources.arsc from current AAPT2 builds ("res1 must be zero"), so use PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fdroidserver
        run: |
          pip install --quiet fdroidserver
          fdroid --version

      - name: Collect APKs
        env:
          GH_TOKEN: ${{ secrets.SOURCES_TOKEN || github.token }}
        run: bash scripts/collect-apks.sh

      # Keeps "added on" dates stable between builds.
      - uses: actions/cache@v4
        with:
          path: fdroid/tmp
          key: fdroid-tmp-${{ github.run_id }}
          restore-keys: fdroid-tmp-

      - name: Build and sign index
        env:
          REPO_URL: ${{ vars.REPO_URL || format('https://{0}.github.io/{1}/repo', github.repository_owner, github.event.repository.name) }}
          REPO_NAME: ${{ vars.REPO_NAME || 'Appbutik' }}
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS || 'appbutik' }}
        run: |
          export REPO_URL=$(echo "$REPO_URL" | tr '[:upper:]' '[:lower:]')
          bash scripts/build-repo.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The same site as an nginx image for Coolify. An image rather than a git branch,
      # because GitHub refuses files over 100 MB and APKs get close to that.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # COOLIFY_WEBHOOK: the resource's deploy webhook URL. COOLIFY_TOKEN: a Coolify API token with deploy rights.
      - name: Deploy to Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK/COOLIFY_TOKEN not set; image pushed but not deployed"
            exit 0
          fi
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
